# Everblush Template: This file is a template generated from the 'kanso' theme.
# Please review and update colors to fully match the Everblush palette.
# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.
#
# Everblush Palette:
# background_dark: #1e252a
# background_light: #2a3138
# foreground: #dadada
# red: #e57474
# green: #8ccf7e
# yellow: #e5c76b
# blue: #67b0e5
# magenta: #c47fd5
# cyan: #63cdcf
# white: #dadada
# black: #1e252a

$activeBorderColor = rgba(108,191,191,0.93) # cyan  rgba(35,42,45,0.93)


general {
    col.active_border = $activeBorderColor
    gaps_in = 4
    gaps_out = 5
    border_size = 2
}

group {
    col.border_active = $activeBorderColor
}

decoration {
    rounding = 3
    rounding_power = 3
      shadow {
      enabled = yes
      range = 16
    }
}

animations {
    enabled = yes

    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softSnap, 0.2, 0.8, 0.2, 1

    animation = windows, 1, 3, easeOutExpo, popin 80%
    animation = windowsOut, 1, 3, easeOutExpo, popin 80%

    animation = fadeIn, 1, 2, softSnap
    animation = fadeOut, 1, 2, softSnap

    animation = workspaces, 1, 4, softSnap, slide

    animation = layers, 1, 3, softSnap, fade
}
