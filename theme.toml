# Everblush Template: This file is a template generated from the 'kanso' theme.
# Please review and update colors to fully match the Everblush palette.
#
# Everblush Palette:
# background_dark: #1e252a
# background_light: #2a3138
# foreground: #dadada
# red: #e57474
# green: #8ccf7e
# yellow: #e5c76b
# blue: #67b0e5
# magenta: #c47fd5
# cyan: #63cdcf
# white: #dadada
# black: #1e252a
[manager]
marker_copied = { fg = "#8ccf7e", bg = "#8ccf7e" } # everblush_green
marker_cut = { fg = "#e57474", bg = "#e57474" } # everblush_red
marker_marked = { fg = "#c47fd5", bg = "#c47fd5" } # everblush_magenta
marker_selected = { fg = "#c47fd5", bg = "#c47fd5" } # everblush_magenta (mapped from a brown)

cwd = { fg = "#e5c76b" } # everblush_yellow
hovered = { reversed = true }
preview_hovered = { reversed = true }

find_keyword = { fg = "#c47fd5", bg = "#1e252a" } # everblush_magenta, everblush_background_dark
find_position = {}

tab_active = { reversed = true }
tab_inactive = {}
tab_width = 1

count_copied = { fg = "#1e252a", bg = "#8ccf7e" } # everblush_background_dark, everblush_green
count_cut = { fg = "#1e252a", bg = "#e57474" } # everblush_background_dark, everblush_red
count_selected = { fg = "#1e252a", bg = "#e5c76b" } # everblush_background_dark, everblush_yellow

border_symbol = "│"
border_style = { fg = "#dadada" } # everblush_foreground


[mode]
normal_main = { fg = "#1e252a", bg = "#67b0e5" } # everblush_background_dark, everblush_blue
normal_alt = { fg = "#67b0e5", bg = "#1e252a" } # everblush_blue, everblush_background_dark
select_main = { fg = "#1e252a", bg = "#c47fd5" } # everblush_background_dark, everblush_magenta
select_alt = { fg = "#c47fd5", bg = "#1e252a" } # everblush_magenta, everblush_background_dark
unset_main = { fg = "#1e252a", bg = "#e5c76b" } # everblush_background_dark, everblush_yellow
unset_alt = { fg = "#e5c76b", bg = "#1e252a" } # everblush_yellow, everblush_background_dark


[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
overall = { fg = "#dadada", bg = "#1e252a" } # everblush_foreground, everblush_background_dark

progress_label = { fg = "#67b0e5", bg = "#1e252a", bold = true } # everblush_blue, everblush_background_dark
progress_normal = { fg = "#1e252a", bg = "#1e252a" } # everblush_black, everblush_black
progress_error = { fg = "#1e252a", bg = "#1e252a" } # everblush_black, everblush_black

perm_type = { fg = "#8ccf7e" } # everblush_green
perm_read = { fg = "#e5c76b" } # everblush_yellow
perm_write = { fg = "#e57474" } # everblush_red
perm_exec = { fg = "#63cdcf" } # everblush_cyan
perm_sep = { fg = "#c47fd5" } # everblush_magenta


[pick]
border = { fg = "#67b0e5" } # everblush_blue
active = { fg = "#c47fd5", bold = true } # everblush_magenta
inactive = {}

[input]
border = { fg = "#67b0e5" } # everblush_blue
title = {}
value = {}
selected = { reversed = true }

[completion]
border = { fg = "#67b0e5" } # everblush_blue
active = { reversed = true }
inactive = {}

[tasks]
border = { fg = "#67b0e5" } # everblush_blue
title = {}
hovered = { fg = "#c47fd5" } # everblush_magenta

[which]
cols = 2
separator = " - "
separator_style = { fg = "#dadada" } # everblush_foreground
mask = { bg = "#1e252a" } # everblush_background_dark
rest = { fg = "#dadada" } # everblush_foreground
cand = { fg = "#63cdcf" } # everblush_cyan
desc = { fg = "#dadada" } # everblush_foreground

[help]
on = { fg = "#63cdcf" } # everblush_cyan
run = { fg = "#c47fd5" } # everblush_magenta
desc = {}
hovered = { reversed = true, bold = true }
footer = { fg = "#1e252a", bg = "#dadada" } # everblush_background_dark, everblush_foreground

[notify]
title_info = { fg = "#8ccf7e" } # everblush_green
title_warn = { fg = "#e5c76b" } # everblush_yellow
title_error = { fg = "#e57474" } # everblush_red

[filetype]
rules = [
    # images
    { mime = "image/*", fg = "#e5c76b" }, # everblush_yellow

    # media
    { mime = "{audio,video}/*", fg = "#c47fd5" }, # everblush_magenta

    # archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e57474" }, # everblush_red

    # documents
    { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#e57474" }, # everblush_red (mapped from a grayish purple)

    # broken links
    { name = "*", is = "orphan", fg = "#e57474" }, # everblush_red

    # executables
    { name = "*", is = "exec", fg = "#63cdcf" }, # everblush_cyan

    # fallback
    { name = "*", fg = "#dadada" }, # everblush_foreground
    { name = "*/", fg = "#67b0e5" }, # everblush_blue
]
